name: Build indexer image (amd64)

# Builds the Blockscout backend (indexer + API) image for linux/amd64 on a native
# amd64 runner and publishes it as a downloadable .tar.gz artifact.
#
# Rationale: the target environment is an air-gapped bank VM that can reach neither
# ghcr.io nor registry-1.docker.io. The deliverable is therefore a tarball to be
# moved by hand and loaded with `docker load`, not a registry push.
#
# Building on a native amd64 runner is required: cross-building this image from an
# arm64 host (Apple Silicon) fails non-deterministically because the Erlang JIT is
# not reliably emulated under either QEMU or Rosetta.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag or SHA)"
        required: false
        default: master
      push_ghcr:
        description: "Also push the image to ghcr.io/proviroll/blockscout"
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/build-indexer-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build linux/amd64
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          # RELEASE_VERSION must match mix.exs: the Dockerfile copies config_helper.exs
          # into /app/releases/${RELEASE_VERSION}/ and a mismatch breaks the image.
          VERSION=$(grep -oE 'version: "[0-9]+\.[0-9]+\.[0-9]+"' mix.exs | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ -z "$VERSION" ]; then echo "could not parse version from mix.exs" >&2; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Blockscout $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ github.event.inputs.push_ghcr == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: blockscout/blockscout:${{ steps.version.outputs.version }}
          build-args: |
            RELEASE_VERSION=${{ steps.version.outputs.version }}
            BLOCKSCOUT_VERSION=v${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect image
        run: |
          set -euo pipefail
          IMAGE=blockscout/blockscout:${{ steps.version.outputs.version }}
          docker image inspect "$IMAGE" \
            --format 'arch={{.Architecture}}/{{.Os}} size={{.Size}}'
          # Fail loudly rather than shipping an unusable artifact.
          ARCH=$(docker image inspect "$IMAGE" --format '{{.Architecture}}')
          [ "$ARCH" = "amd64" ] || { echo "expected amd64, got $ARCH" >&2; exit 1; }

      - name: Save image to tarball
        run: |
          set -euo pipefail
          IMAGE=blockscout/blockscout:${{ steps.version.outputs.version }}
          docker save "$IMAGE" | gzip -9 > blockscout-indexer-${{ steps.version.outputs.version }}-amd64.tar.gz
          ls -lh blockscout-indexer-*.tar.gz

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: blockscout-indexer-${{ steps.version.outputs.version }}-amd64
          path: blockscout-indexer-${{ steps.version.outputs.version }}-amd64.tar.gz
          retention-days: 30
          compression-level: 0

      - name: Push to GHCR
        if: ${{ github.event.inputs.push_ghcr == 'true' }}
        run: |
          set -euo pipefail
          SRC=blockscout/blockscout:${{ steps.version.outputs.version }}
          DST=ghcr.io/proviroll/blockscout:${{ steps.version.outputs.version }}
          docker tag "$SRC" "$DST"
          docker push "$DST"
